<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>삼성전자 AI 투자 비서</title>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="gnb">
			<div class="logo">
				<button id="btn-toggle-sidebar" class="icon-btn" style="margin-right: 10px" title="채팅 목록 열기/닫기">
					<i class="fa-solid fa-bars"></i>
				</button>
				<i class="fa-solid fa-chart-line"></i> 삼성전자 AI 투자 비서
			</div>
			<div class="gnb-controls">
				<button id="btn-export" class="icon-btn" title="데이터 CSV 내보내기"><i class="fa-solid fa-download"></i> 내보내기</button>
				<button id="btn-theme" class="icon-btn" title="다크모드 토글">
					<i class="fa-solid fa-moon"></i>
				</button>
			</div>
		</header>

		<div class="app-container">
			<aside class="sidebar">
				<div class="sidebar-header">
					<h3>이전 대화 기록</h3>
					<button id="btn-new-chat" class="icon-btn"><i class="fa-solid fa-plus"></i></button>
				</div>
				<ul id="conversation-list" class="history-list"></ul>
			</aside>

			<div class="main-content">
				<!-- ✨ 좌측: 대시보드 스크롤 영역 -->
				<main class="dashboard card">
					<header class="dashboard-header" style="display: flex; flex-direction: column; gap: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem">
						<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem">
							<div class="tabs">
								<button class="tab-btn active" data-target="chart-view"><i class="fa-solid fa-chart-area"></i> 차트 보기</button>
								<button class="tab-btn" data-target="summary-view"><i class="fa-solid fa-table"></i> 요약 통계 보기</button>
							</div>

							<div id="chart-controls" style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap">
								<select id="chart-type" style="padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main)">
									<option value="line">꺾은선 차트</option>
									<option value="box">박스(캔들) 차트</option>
								</select>
								<div id="chart-filters" style="display: flex; gap: 0.5rem; align-items: center">
									<button class="filter-btn" data-days="1">1일</button>
									<button class="filter-btn" data-days="5">1주</button>
									<button class="filter-btn" data-days="20">1개월</button>
									<button class="filter-btn" data-days="250">1년</button>

									<div class="custom-date-filter" style="display: flex; align-items: center; gap: 0.5rem; margin-left: 0.5rem; padding-left: 0.5rem; border-left: 1px solid var(--border-color)">
										<input type="date" id="start-date" class="date-input" title="시작일" />
										<span style="color: var(--text-muted)">~</span>
										<input type="date" id="end-date" class="date-input" title="종료일" />
										<button id="btn-custom-date" style="padding: 6px 12px; border-radius: 4px; border: none; background: var(--primary-color); color: white; cursor: pointer; font-weight: bold">조회</button>
									</div>
								</div>
							</div>
						</div>
					</header>

					<div id="chart-view" class="view-content active">
						<div class="chart-container">
							<canvas id="stockChart"></canvas>
						</div>
					</div>

					<div id="summary-view" class="view-content">
						<div class="summary-stats-grid" id="summary-stats"></div>
					</div>

					<hr style="border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0 1rem 0" />
					<div class="portfolio-section">
						<h3 id="btn-toggle-portfolio" style="margin-bottom: 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-main)">
							<span>💼 나의 가상 투자 기록</span>
							<i class="fa-solid fa-chevron-up" id="portfolio-icon"></i>
						</h3>

						<div id="portfolio-content" class="portfolio-content">
							<div class="chat-input-area" style="margin-bottom: 1rem">
								<select id="port-type" style="flex: 0.5; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color)">
									<option value="buy">매수</option>
									<option value="sell">매도</option>
								</select>
								<input type="date" id="port-date" style="flex: 1" />
								<input type="number" id="port-price" placeholder="단가 (원)" style="flex: 1.5" />
								<input type="number" id="port-qty" placeholder="수량 (주)" style="flex: 1" />
								<button id="btn-add-portfolio" style="border-radius: 4px">기록 추가</button>
							</div>

							<div id="portfolio-summary" style="margin-bottom: 1rem; padding: 1rem; background: var(--bg-color); border-radius: 8px; font-weight: bold; color: var(--text-main)"></div>

							<!-- 리스트 컨테이너 클래스 지정 -->
							<div id="portfolio-list" class="portfolio-list-container"></div>
						</div>
					</div>
				</main>

				<!-- ✨ 우측: 채팅창 고정 영역 -->
				<section class="chat-section card">
					<div class="chat-messages" id="chat-messages">
						<div class="message ai-message">안녕하세요! 삼성전자 주가 데이터가 준비되어 있습니다. 무엇을 분석해 드릴까요?</div>
					</div>
					<div class="chat-input-area">
						<input type="text" id="chat-input" placeholder="AI에게 투자 인사이트를 물어보세요..." />
						<button id="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
					</div>
				</section>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/app.js"></script>
		<script src="js/data.js"></script>
		<script src="js/chat.js"></script>
	</body>
</html>
